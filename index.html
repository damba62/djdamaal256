<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Damba Music</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <a href="#">Home</a>
    <a href="#">Music</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
</nav>

<header>
    <img src="images/logo.png" class="logo" alt="DAMBA Logo">
    <h1 id="flipName">DAMBA</h1>
    <p>Official Music Website</p>
</header>

<section class="music">

    <div class="card">
        <img src="images/cover1.jpg" class="cover" alt="Cover 1">
        <h2>My Latest Song</h2>
        <p>Artist: DAMBA</p>

        <audio controls>
            <source src="music/song.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>

        <a class="download" href="music/song.mp3" download>
            Download Song
        </a>
    </div>

    <div class="card">
        <img src="images/cover2.jpg" class="cover" alt="Cover 2">
        <h2>New Release</h2>
        <p>Artist: DAMBA</p>

        <audio controls>
            <source src="music/song2.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>

        <a class="download" href="music/song2.mp3" download>
            Download Song
        </a>
    </div>

</section>

<div class="social">
    <a href="#">TikTok</a>
    <a href="#">YouTube</a>
    <a href="#">Facebook</a>
</div>

<script src="script.js"></script>

</body>
</html>
